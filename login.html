<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ShopBrain Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      width: 100%;
      max-width: 380px;
      padding: 35px 30px;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 6px;
    }

    .logo span {
      color: #6366f1;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #374151;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 18px;
    }

    input:focus {
      outline: none;
      border-color: #6366f1;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      background: #111827;
      color: white;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error {
      margin-bottom: 18px;
      padding: 12px 14px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .footnote {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">Shop<span>Brain</span></div>
    <div class="subtitle">Admin sign in</div>

    <div id="errorBox" class="error"></div>

    <form id="loginForm">

      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <button type="submit" id="submitBtn">Sign In</button>

    </form>

    <div class="footnote">
      Access is restricted to ShopBrain admins only.
    </div>

  </div>

  <script>

    // ==========================================================
    // SHOPBRAIN SUPABASE
    // ==========================================================

    const SUPABASE_URL =
      "https://aqxdmlyvmjmkdnqkwgot.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_3KNS1nc4-tFxz2zg_EoekQ_T7lyEARm";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================================
    // ERROR HELPERS
    // ==========================================================

    function showError(message) {
      const box = document.getElementById("errorBox");
      box.textContent = message;
      box.style.display = "block";
    }

    function hideError() {
      document.getElementById("errorBox").style.display = "none";
    }


    // ==========================================================
    // IF ALREADY LOGGED IN AS ADMIN, SKIP STRAIGHT TO DASHBOARD
    // ==========================================================

    async function checkExistingSession() {

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (!user) return;

      const {
        data: admin
      } = await supabaseClient
        .from("admin_profiles")
        .select("is_active")
        .eq("id", user.id)
        .single();

      if (admin && admin.is_active) {
        window.location.href = "index.html";
      }
    }

    checkExistingSession();


    // ==========================================================
    // LOGIN FORM SUBMIT
    // ==========================================================

    const form = document.getElementById("loginForm");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (event) => {

      event.preventDefault();
      hideError();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in...";

      // Step 1: authenticate with Supabase Auth
      const {
        data: authData,
        error: authError
      } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (authError || !authData.user) {
        showError("Incorrect email or password.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
        return;
      }

      // Step 2: confirm this user is a real, active admin
      const {
        data: admin,
        error: adminError
      } = await supabaseClient
        .from("admin_profiles")
        .select("is_active, role")
        .eq("id", authData.user.id)
        .single();

      if (adminError || !admin) {
        showError("This account is not registered as an admin.");
        await supabaseClient.auth.signOut();
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
        return;
      }

      if (!admin.is_active) {
        showError("Your admin account has been deactivated.");
        await supabaseClient.auth.signOut();
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
        return;
      }

      // Success — go to dashboard
      window.location.href = "index.html";
    });

  </script>

</body>
</html>
