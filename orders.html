<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ShopBrain Admin — Orders</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: #111827;
      color: white;
      padding: 25px 15px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      padding: 0 15px 30px;
    }

    .logo span {
      color: #6366f1;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav a {
      border: none;
      background: transparent;
      color: #d1d5db;
      padding: 13px 15px;
      text-align: left;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      text-decoration: none;
      display: block;
    }

    .nav a:hover,
    .nav a.active {
      background: #1f2937;
      color: white;
    }

    .logout {
      position: absolute;
      bottom: 25px;
      left: 15px;
      right: 15px;
    }

    .logout button {
      width: 100%;
      padding: 12px;
      border: 1px solid #374151;
      background: transparent;
      color: #fca5a5;
      border-radius: 8px;
      cursor: pointer;
    }

    .main {
      margin-left: 250px;
      width: calc(100% - 250px);
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .topbar h1 {
      font-size: 28px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filter-btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #d1d5db;
      background: white;
      color: #374151;
      font-size: 13px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #111827;
      color: white;
      border-color: #111827;
    }

    .card {
      background: white;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      overflow: hidden;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 15px 20px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
      white-space: nowrap;
    }

    th {
      font-size: 12px;
      color: #6b7280;
      text-transform: uppercase;
    }

    td {
      font-size: 14px;
    }

    tr.row-clickable {
      cursor: pointer;
    }

    tr.row-clickable:hover {
      background: #f9fafb;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-transform: capitalize;
    }

    .pending_payment { background: #fef3c7; color: #92400e; }
    .payment_verified { background: #dbeafe; color: #1e40af; }
    .payment_rejected { background: #fee2e2; color: #991b1b; }
    .in_training { background: #ede9fe; color: #5b21b6; }
    .completed { background: #dcfce7; color: #166534; }

    .empty, .loading {
      padding: 40px;
      text-align: center;
      color: #6b7280;
    }

    .error {
      margin-bottom: 20px;
      padding: 15px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      display: none;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.5);
      z-index: 100;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: 14px;
      width: 100%;
      max-width: 720px;
      margin-top: 30px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .modal-header {
      padding: 20px 25px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 19px;
    }

    .close-btn {
      border: none;
      background: #f3f4f6;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
    }

    .modal-tabs {
      display: flex;
      border-bottom: 1px solid #e5e7eb;
      padding: 0 25px;
    }

    .tab-btn {
      padding: 14px 16px;
      border: none;
      background: transparent;
      color: #6b7280;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: #111827;
      border-bottom-color: #6366f1;
      font-weight: bold;
    }

    .tab-content {
      display: none;
      padding: 22px 25px;
      max-height: 60vh;
      overflow-y: auto;
    }

    .tab-content.active {
      display: block;
    }

    .field-row {
      margin-bottom: 16px;
    }

    .field-label {
      font-size: 12px;
      color: #6b7280;
      text-transform: uppercase;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .field-value {
      font-size: 14px;
      color: #111827;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .faq-item, .product-item {
      background: #f9fafb;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }

    .receipt-img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      margin-bottom: 16px;
      display: block;
    }

    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .train-section {
      margin-top: 26px;
      padding-top: 22px;
      border-top: 2px solid #f0f0f0;
    }

    .train-section .field-label {
      font-size: 13px;
    }

    .train-textarea {
      width: 100%;
      min-height: 220px;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 13px;
      font-family: monospace;
      resize: vertical;
      margin-bottom: 10px;
    }

    .train-textarea:focus {
      outline: none;
      border-color: #6366f1;
    }

    .train-meta {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 10px;
    }

    .btn-draft { background: #f3f4f6; color: #111827; }
    .btn-save-prompt { background: #16a34a; color: white; }

    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .btn-approve { background: #16a34a; color: white; }
    .btn-reject { background: #dc2626; color: white; }
    .btn-train { background: #6366f1; color: white; }
    .btn-complete { background: #111827; color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .chat-box {
      display: flex;
      flex-direction: column;
      height: 340px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background: #f9fafb;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .msg {
      max-width: 75%;
      padding: 9px 13px;
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 1.4;
    }

    .msg.user {
      background: white;
      border: 1px solid #e5e7eb;
      margin-right: auto;
    }

    .msg.admin {
      background: #6366f1;
      color: white;
      margin-left: auto;
    }

    .msg-time {
      font-size: 10px;
      opacity: 0.6;
      margin-top: 4px;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
    }

    .chat-input-row input {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
    }

    .chat-input-row button {
      padding: 11px 18px;
      border: none;
      background: #111827;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 70px;
        padding: 20px 8px;
      }

      .logo {
        font-size: 0;
        text-align: center;
        padding: 0 0 25px;
      }

      .logo span {
        font-size: 22px;
      }

      .nav a {
        text-align: center;
        font-size: 0;
      }

      .nav a::first-letter {
        font-size: 20px;
      }

      .logout button {
        font-size: 0;
      }

      .logout button::before {
        content: "↪";
        font-size: 20px;
      }

      .main {
        margin-left: 70px;
        width: calc(100% - 70px);
        padding: 18px;
      }

      .topbar h1 {
        font-size: 22px;
      }

      .modal {
        margin-top: 10px;
      }

      th, td {
        padding: 12px 14px;
      }
    }
  </style>
</head>

<body>

<div class="layout">

  <aside class="sidebar">

    <div class="logo">Shop<span>Brain</span></div>

    <div class="nav">
      <a href="admin.html">📊 Dashboard</a>
      <a href="orders.html" class="active">📋 Orders</a>
      <a href="agents.html">🤖 Agents</a>
      <a href="messages.html">💬 Messages</a>
      <a href="admins.html">👥 Admins</a>
      <a href="tools.html">🛠️ Tools</a>
    </div>

    <div class="logout">
      <button onclick="logout()">Logout</button>
    </div>

  </aside>

  <main class="main">

    <div id="errorBox" class="error"></div>

    <div class="topbar">
      <div>
        <h1>Training Orders</h1>
        <p style="color:#6b7280;margin-top:5px;">Review, verify, and train customer orders</p>
      </div>
      <div class="admin-info" style="background:white;padding:10px 15px;border-radius:10px;border:1px solid #e5e7eb;">
        <span id="adminName">Loading...</span>
      </div>
    </div>

    <div class="filters" id="filterBar">
      <button class="filter-btn active" data-status="all">All</button>
      <button class="filter-btn" data-status="pending_payment">Pending Payment</button>
      <button class="filter-btn" data-status="payment_verified">Verified</button>
      <button class="filter-btn" data-status="in_training">In Training</button>
      <button class="filter-btn" data-status="completed">Completed</button>
      <button class="filter-btn" data-status="payment_rejected">Rejected</button>
    </div>

    <section class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Business</th>
              <th>Tier</th>
              <th>Price</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="ordersTable">
            <tr><td colspan="5" class="loading">Loading orders...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">

    <div class="modal-header">
      <h2 id="modalTitle">Order</h2>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>

    <div class="modal-tabs">
      <button class="tab-btn active" data-tab="knowledge">Knowledge</button>
      <button class="tab-btn" data-tab="receipt">Receipt</button>
      <button class="tab-btn" data-tab="chat">Chat</button>
    </div>

    <div class="tab-content active" id="tab-knowledge"></div>

    <div class="tab-content" id="tab-receipt"></div>

    <div class="tab-content" id="tab-chat">
      <div class="chat-box">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Type a message...">
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>

  const SUPABASE_URL = "https://aqxdmlyvmjmkdnqkwgot.supabase.co";
  const SUPABASE_KEY = "sb_publishable_3KNS1nc4-tFxz2zg_EoekQ_T7lyEARm";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentAdminId = null;
  let allOrders = [];
  let activeFilter = "all";
  let currentOrder = null;
  let chatChannel = null;

  function showError(message) {
    const box = document.getElementById("errorBox");
    box.textContent = message;
    box.style.display = "block";
  }

  function hideError() {
    document.getElementById("errorBox").style.display = "none";
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  async function checkAdmin() {
    hideError();

    const { data: { user }, error } = await supabaseClient.auth.getUser();

    if (error || !user) {
      window.location.href = "login.html";
      return false;
    }

    const { data: admin, error: adminError } = await supabaseClient
      .from("admin_profiles")
      .select("full_name, role, is_active")
      .eq("id", user.id)
      .single();

    if (adminError || !admin || !admin.is_active) {
      await supabaseClient.auth.signOut();
      window.location.href = "login.html";
      return false;
    }

    currentAdminId = user.id;
    document.getElementById("adminName").textContent = admin.full_name || "Admin";
    return true;
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
  }

  async function loadOrders() {
    const allowed = await checkAdmin();
    if (!allowed) return;

    hideError();

    const { data: orders, error } = await supabaseClient
      .from("training_orders")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      showError("Unable to load orders: " + error.message);
      return;
    }

    allOrders = orders || [];
    renderTable();
  }

  function renderTable() {
    const table = document.getElementById("ordersTable");

    const filtered = activeFilter === "all"
      ? allOrders
      : allOrders.filter(o => o.status === activeFilter);

    if (filtered.length === 0) {
      table.innerHTML = `<tr><td colspan="5" class="empty">No orders in this category.</td></tr>`;
      return;
    }

    table.innerHTML = filtered.map(order => {
      const date = new Date(order.created_at).toLocaleDateString();
      const tier = order.tier ? order.tier.charAt(0).toUpperCase() + order.tier.slice(1) : "-";
      const status = order.status ? order.status.replaceAll("_", " ") : "-";

      return `
        <tr class="row-clickable" onclick="openOrder('${order.id}')">
          <td>${escapeHtml(order.business_name || "Unnamed business")}</td>
          <td>${escapeHtml(tier)}</td>
          <td>$${Number(order.price_usd || 0).toFixed(2)}</td>
          <td><span class="status ${order.status}">${escapeHtml(status)}</span></td>
          <td>${date}</td>
        </tr>
      `;
    }).join("");
  }

  document.getElementById("filterBar").addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;

    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.status;
    renderTable();
  });

  async function openOrder(orderId) {
    const order = allOrders.find(o => o.id === orderId);
    if (!order) return;

    currentOrder = order;

    document.getElementById("modalTitle").textContent =
      order.business_name || "Order Detail";

    renderKnowledgeTab(order);
    renderReceiptTab(order);
    await loadChat(order.id);

    switchTab("knowledge");
    document.getElementById("modalOverlay").classList.add("open");
  }

  function closeModal() {
    document.getElementById("modalOverlay").classList.remove("open");
    currentOrder = null;

    if (chatChannel) {
      supabaseClient.removeChannel(chatChannel);
      chatChannel = null;
    }
  }

  document.querySelector(".modal-tabs").addEventListener("click", (e) => {
    const btn = e.target.closest(".tab-btn");
    if (!btn) return;
    switchTab(btn.dataset.tab);
  });

  function switchTab(tabName) {
    document.querySelectorAll(".tab-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.tab === tabName)
    );
    document.querySelectorAll(".tab-content").forEach(c =>
      c.classList.toggle("active", c.id === "tab-" + tabName)
    );
  }

  function renderKnowledgeTab(order) {
    const el = document.getElementById("tab-knowledge");

    let products = [];
    let faqs = [];

    try { products = order.products ? (typeof order.products === "string" ? JSON.parse(order.products) : order.products) : []; } catch (e) { products = []; }
    try { faqs = order.faqs ? (typeof order.faqs === "string" ? JSON.parse(order.faqs) : order.faqs) : []; } catch (e) { faqs = []; }

    const productsHtml = (Array.isArray(products) && products.length)
      ? products.map(p => `
          <div class="product-item">
            <strong>${escapeHtml(p.name)}</strong> — $${escapeHtml(p.price ?? "-")}<br>
            <span style="color:#6b7280;font-size:13px;">${escapeHtml(p.description || "")}</span>
          </div>
        `).join("")
      : `<div class="field-value" style="color:#9ca3af;">No products listed.</div>`;

    const faqsHtml = (Array.isArray(faqs) && faqs.length)
      ? faqs.map(f => `
          <div class="faq-item">
            <strong>${escapeHtml(f.question)}</strong><br>
            <span style="color:#374151;font-size:13px;">${escapeHtml(f.answer)}</span>
          </div>
        `).join("")
      : `<div class="field-value" style="color:#9ca3af;">No FAQs submitted.</div>`;

    el.innerHTML = `

      <div class="field-row">
        <div class="field-label">Tier</div>
        <div class="field-value">${escapeHtml(order.tier)}</div>
      </div>

      <div class="field-row">
        <div class="field-label">Business Description</div>
        <div class="field-value">${escapeHtml(order.business_description || "—")}</div>
      </div>

      <div class="field-row">
        <div class="field-label">Website URL</div>
        <div class="field-value">${escapeHtml(order.website_url || "—")}</div>
      </div>

      <div class="field-row">
        <div class="field-label">Products / Services</div>
        ${productsHtml}
      </div>

      <div class="field-row">
        <div class="field-label">FAQs</div>
        ${faqsHtml}
      </div>

      <div class="field-row">
        <div class="field-label">Shipping Policy</div>
        <div class="field-value">${escapeHtml(order.shipping_policy || "—")}</div>
      </div>

      <div class="field-row">
        <div class="field-label">Returns Policy</div>
        <div class="field-value">${escapeHtml(order.returns_policy || "—")}</div>
      </div>

      <div class="field-row">
        <div class="field-label">Payment Policy</div>
        <div class="field-value">${escapeHtml(order.payment_policy || "—")}</div>
      </div>

      <div class="field-row">
        <div class="field-label">Tone Preference</div>
        <div class="field-value">${escapeHtml(order.tone_preference || "—")}</div>
      </div>

      <div class="field-row">
        <div class="field-label">Escalation Info</div>
        <div class="field-value">${escapeHtml(order.escalation_info || "—")}</div>
      </div>

      <div class="action-row">
        <button class="btn btn-train" onclick="markStatus('in_training')"
          ${order.status !== "payment_verified" ? "disabled" : ""}>
          Mark In Training
        </button>
        <button class="btn btn-complete" onclick="markStatus('completed')"
          ${order.status !== "in_training" ? "disabled" : ""}>
          Mark Completed
        </button>
      </div>

      <div class="train-section" id="trainSection">
        ${order.agent_id ? `
          <div class="field-label">Train AI - System Prompt</div>
          <div class="train-meta" id="agentMeta">Loading agent...</div>
          <textarea class="train-textarea" id="systemPromptBox" placeholder="Write or draft the instructions this AI will follow when chatting with this store's customers..."></textarea>
          <div class="action-row">
            <button class="btn btn-draft" onclick="draftSystemPrompt()">Draft from submitted info</button>
            <button class="btn btn-save-prompt" onclick="saveSystemPrompt()">Save to Agent</button>
          </div>
        ` : `
          <div class="field-label">AI Agent</div>
          <div class="field-value" style="color:#9ca3af;margin-bottom:12px;">This order has no AI agent yet. Create one to begin training.</div>
          <button class="btn btn-train" onclick="createAgentForOrder()">+ Create AI Agent</button>
        `}
      </div>
    `;

    if (order.agent_id) {
      loadAgentPrompt(order.agent_id);
    }
  }

  async function createAgentForOrder() {
    if (!currentOrder) return;

    const { data: agent, error: agentError } = await supabaseClient
      .from("agents")
      .insert({
        user_id: currentOrder.user_id,
        name: currentOrder.business_name || "Unnamed business",
        status: "untrained"
      })
      .select()
      .single();

    if (agentError || !agent) {
      showError("Failed to create agent: " + (agentError?.message || "unknown error"));
      return;
    }

    const { error: updateError } = await supabaseClient
      .from("training_orders")
      .update({ agent_id: agent.id })
      .eq("id", currentOrder.id);

    if (updateError) {
      showError("Agent created, but failed to link it to the order: " + updateError.message);
      return;
    }

    currentOrder.agent_id = agent.id;

    const idx = allOrders.findIndex(o => o.id === currentOrder.id);
    if (idx !== -1) allOrders[idx].agent_id = agent.id;

    showSuccessInline("AI agent created and linked to this order.");
    renderKnowledgeTab(currentOrder);
  }

  function showSuccessInline(message) {
    // lightweight inline success using the existing error box styling area
    const box = document.getElementById("errorBox");
    box.style.background = "#dcfce7";
    box.style.color = "#166534";
    box.textContent = message;
    box.style.display = "block";
    setTimeout(() => {
      box.style.display = "none";
      box.style.background = "";
      box.style.color = "";
    }, 3000);
  }

  // ==========================================================
  // TRAIN AI — SYSTEM PROMPT (load / draft / save)
  // ==========================================================

  async function loadAgentPrompt(agentId) {
    const metaEl = document.getElementById("agentMeta");
    const boxEl = document.getElementById("systemPromptBox");

    if (!agentId) {
      metaEl.textContent = "No agent linked to this order.";
      return;
    }

    const { data: agent, error } = await supabaseClient
      .from("agents")
      .select("name, status, system_prompt, last_trained_at")
      .eq("id", agentId)
      .single();

    if (error || !agent) {
      metaEl.textContent = "Unable to load agent.";
      return;
    }

    boxEl.value = agent.system_prompt || "";

    metaEl.textContent = agent.last_trained_at
      ? `Agent: ${agent.name} — last trained ${new Date(agent.last_trained_at).toLocaleString()}`
      : `Agent: ${agent.name} — not trained yet`;
  }

  function draftSystemPrompt() {
    if (!currentOrder) return;

    const o = currentOrder;

    let products = [];
    let faqs = [];

    try { products = o.products ? (typeof o.products === "string" ? JSON.parse(o.products) : o.products) : []; } catch (e) { products = []; }
    try { faqs = o.faqs ? (typeof o.faqs === "string" ? JSON.parse(o.faqs) : o.faqs) : []; } catch (e) { faqs = []; }

    const productLines = (Array.isArray(products) && products.length)
      ? products.map(p => `- ${p.name}${p.price ? " — $" + p.price : ""}${p.description ? ": " + p.description : ""}`).join("\n")
      : "- (no products listed)";

    const faqLines = (Array.isArray(faqs) && faqs.length)
      ? faqs.map(f => `Q: ${f.question}\nA: ${f.answer}`).join("\n\n")
      : "(no FAQs submitted)";

    const draft = `You are the AI customer support assistant for ${o.business_name || "this business"}.

BUSINESS DESCRIPTION:
${o.business_description || "(not provided)"}

TONE:
Respond in a ${o.tone_preference || "friendly and helpful"} tone at all times.

PRODUCTS / SERVICES:
${productLines}

FREQUENTLY ASKED QUESTIONS:
${faqLines}

SHIPPING POLICY:
${o.shipping_policy || "(not provided)"}

RETURNS POLICY:
${o.returns_policy || "(not provided)"}

PAYMENT METHODS:
${o.payment_policy || "(not provided)"}

WHEN YOU DON'T KNOW THE ANSWER:
${o.escalation_info || "Politely let the customer know you'll connect them with the business owner."}

Always stay on topic, represent the business accurately, and never make up information not provided above.`;

    document.getElementById("systemPromptBox").value = draft;
  }

  async function saveSystemPrompt() {
    if (!currentOrder || !currentOrder.agent_id) {
      showError("This order has no linked agent to save to.");
      return;
    }

    const prompt = document.getElementById("systemPromptBox").value.trim();

    if (!prompt) {
      showError("System prompt is empty — write or draft one before saving.");
      return;
    }

    const { error } = await supabaseClient
      .from("agents")
      .update({
        system_prompt: prompt,
        last_trained_at: new Date().toISOString(),
        status: "training"
      })
      .eq("id", currentOrder.agent_id);

    if (error) {
      showError("Unable to save system prompt: " + error.message);
      return;
    }

    document.getElementById("agentMeta").textContent =
      `Saved — last trained ${new Date().toLocaleString()}`;
  }

  async function renderReceiptTab(order) {
    const el = document.getElementById("tab-receipt");

    el.innerHTML = `<div class="loading">Loading receipt...</div>`;

    let imageUrl = null;

    if (order.receipt_image_url) {
      const { data, error } = await supabaseClient
        .storage
        .from("receipts")
        .createSignedUrl(order.receipt_image_url, 3600);

      if (!error && data) {
        imageUrl = data.signedUrl;
      }
    }

    el.innerHTML = `

      ${imageUrl
        ? `<img class="receipt-img" src="${imageUrl}" alt="Payment receipt">`
        : `<div class="field-value" style="color:#9ca3af;margin-bottom:16px;">No receipt image on file.</div>`
      }

      <div class="field-row">
        <div class="field-label">Reference / Note</div>
        <div class="field-value">${escapeHtml(order.receipt_note || "—")}</div>
      </div>

      <div class="field-row">
        <div class="field-label">Amount</div>
        <div class="field-value">$${Number(order.price_usd || 0).toFixed(2)}</div>
      </div>

      <div class="action-row">
        <button class="btn btn-approve" onclick="markStatus('payment_verified')"
          ${order.status !== "pending_payment" ? "disabled" : ""}>
          ✓ Approve Payment
        </button>
        <button class="btn btn-reject" onclick="markStatus('payment_rejected')"
          ${order.status !== "pending_payment" ? "disabled" : ""}>
          ✕ Reject Payment
        </button>
      </div>
    `;
  }

  async function markStatus(newStatus) {
    if (!currentOrder) return;

    const { error } = await supabaseClient
      .from("training_orders")
      .update({
        status: newStatus,
        assigned_admin_id: currentAdminId
      })
      .eq("id", currentOrder.id);

    if (error) {
      showError("Unable to update order: " + error.message);
      return;
    }

    currentOrder.status = newStatus;

    const idx = allOrders.findIndex(o => o.id === currentOrder.id);
    if (idx !== -1) allOrders[idx].status = newStatus;

    // When an order is completed, activate its linked agent
    if (newStatus === "completed" && currentOrder.agent_id) {
      await supabaseClient
        .from("agents")
        .update({ status: "active" })
        .eq("id", currentOrder.agent_id);
    }

    renderTable();
    renderKnowledgeTab(currentOrder);
    renderReceiptTab(currentOrder);
  }

  async function loadChat(orderId) {
    const { data: messages, error } = await supabaseClient
      .from("order_messages")
      .select("*")
      .eq("order_id", orderId)
      .order("created_at", { ascending: true });

    if (error) {
      showError("Unable to load chat: " + error.message);
      return;
    }

    renderChatMessages(messages || []);

    if (chatChannel) {
      supabaseClient.removeChannel(chatChannel);
    }

    chatChannel = supabaseClient
      .channel("order_messages_" + orderId)
      .on("postgres_changes", {
        event: "INSERT",
        schema: "public",
        table: "order_messages",
        filter: "order_id=eq." + orderId
      }, (payload) => {
        appendChatMessage(payload.new);
      })
      .subscribe();
  }

  function renderChatMessages(messages) {
    const box = document.getElementById("chatMessages");

    if (messages.length === 0) {
      box.innerHTML = `<div style="color:#9ca3af;text-align:center;padding:20px;">No messages yet.</div>`;
      return;
    }

    box.innerHTML = messages.map(msgHtml).join("");
    box.scrollTop = box.scrollHeight;
  }

  function appendChatMessage(msg) {
    const box = document.getElementById("chatMessages");
    box.insertAdjacentHTML("beforeend", msgHtml(msg));
    box.scrollTop = box.scrollHeight;
  }

  function msgHtml(msg) {
    const time = new Date(msg.created_at).toLocaleString();
    return `
      <div class="msg ${msg.sender_type}">
        ${escapeHtml(msg.message)}
        <div class="msg-time">${time}</div>
      </div>
    `;
  }

  async function sendMessage() {
    const input = document.getElementById("chatInput");
    const text = input.value.trim();

    if (!text || !currentOrder) return;

    const { error } = await supabaseClient
      .from("order_messages")
      .insert({
        order_id: currentOrder.id,
        sender_type: "admin",
        sender_id: currentAdminId,
        message: text
      });

    if (error) {
      showError("Unable to send message: " + error.message);
      return;
    }

    input.value = "";
  }

  document.getElementById("chatInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  loadOrders();

</script>
