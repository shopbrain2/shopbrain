<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopBrain - Reset Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      width: 100%;
      max-width: 380px;
      padding: 35px 30px;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 6px;
    }

    .logo span { color: #6366f1; }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #374151;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 18px;
    }

    input:focus { outline: none; border-color: #6366f1; }

    button.submit {
      width: 100%;
      padding: 13px;
      border: none;
      background: #111827;
      color: white;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button.submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .error {
      margin-bottom: 18px;
      padding: 12px 14px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .success {
      margin-bottom: 18px;
      padding: 12px 14px;
      background: #dcfce7;
      color: #166534;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">Shop<span>Brain</span></div>
    <div class="subtitle">Set a new password</div>

    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>

    <form id="resetForm">

      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">

      <label for="confirmPassword">Confirm New Password</label>
      <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">

      <button type="submit" class="submit" id="submitBtn">Update Password</button>

    </form>

  </div>

  <script>

    const SUPABASE_URL = "https://aqxdmlyvmjmkdnqkwgot.supabase.co";
    const SUPABASE_KEY = "sb_publishable_3KNS1nc4-tFxz2zg_EoekQ_T7lyEARm";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function showError(message) {
      const box = document.getElementById("errorBox");
      box.textContent = message;
      box.style.display = "block";
      document.getElementById("successBox").style.display = "none";
    }

    function showSuccess(message) {
      const box = document.getElementById("successBox");
      box.textContent = message;
      box.style.display = "block";
      document.getElementById("errorBox").style.display = "none";
    }

    document.getElementById("resetForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (newPassword !== confirmPassword) {
        showError("Passwords do not match.");
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Updating...";

      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

      submitBtn.disabled = false;
      submitBtn.textContent = "Update Password";

      if (error) {
        showError("Unable to update password: " + error.message);
        return;
      }

      showSuccess("Password updated! Redirecting to login...");

      setTimeout(() => {
        window.location.href = "customer-login.html";
      }, 2000);
    });

  </script>

</body>
</html>
