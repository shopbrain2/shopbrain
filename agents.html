<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ShopBrain Admin — Agents</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: #111827;
      color: white;
      padding: 25px 15px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      padding: 0 15px 30px;
    }

    .logo span {
      color: #6366f1;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav a {
      border: none;
      background: transparent;
      color: #d1d5db;
      padding: 13px 15px;
      text-align: left;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      text-decoration: none;
      display: block;
    }

    .nav a:hover,
    .nav a.active {
      background: #1f2937;
      color: white;
    }

    .logout {
      position: absolute;
      bottom: 25px;
      left: 15px;
      right: 15px;
    }

    .logout button {
      width: 100%;
      padding: 12px;
      border: 1px solid #374151;
      background: transparent;
      color: #fca5a5;
      border-radius: 8px;
      cursor: pointer;
    }

    .main {
      margin-left: 250px;
      width: calc(100% - 250px);
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .topbar h1 {
      font-size: 28px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filter-btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #d1d5db;
      background: white;
      color: #374151;
      font-size: 13px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #111827;
      color: white;
      border-color: #111827;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    .stat-title {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
    }

    .card {
      background: white;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      overflow: hidden;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 15px 20px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
      white-space: nowrap;
    }

    th {
      font-size: 12px;
      color: #6b7280;
      text-transform: uppercase;
    }

    td {
      font-size: 14px;
    }

    tr.row-clickable {
      cursor: pointer;
    }

    tr.row-clickable:hover {
      background: #f9fafb;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-transform: capitalize;
    }

    .untrained { background: #f3f4f6; color: #4b5563; }
    .training { background: #ede9fe; color: #5b21b6; }
    .active { background: #dcfce7; color: #166534; }

    .empty, .loading {
      padding: 40px;
      text-align: center;
      color: #6b7280;
    }

    .error {
      margin-bottom: 20px;
      padding: 15px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      display: none;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.5);
      z-index: 100;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: 14px;
      width: 100%;
      max-width: 640px;
      margin-top: 30px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .modal-header {
      padding: 20px 25px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 19px;
    }

    .close-btn {
      border: none;
      background: #f3f4f6;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
    }

    .modal-body {
      padding: 22px 25px;
      max-height: 65vh;
      overflow-y: auto;
    }

    .field-row {
      margin-bottom: 16px;
    }

    .field-label {
      font-size: 12px;
      color: #6b7280;
      text-transform: uppercase;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .field-value {
      font-size: 14px;
      color: #111827;
    }

    .order-item {
      background: #f9fafb;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .order-item .status {
      margin-left: 6px;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 70px;
        padding: 20px 8px;
      }

      .logo {
        font-size: 0;
        text-align: center;
        padding: 0 0 25px;
      }

      .logo span {
        font-size: 22px;
      }

      .nav a {
        text-align: center;
        font-size: 0;
      }

      .nav a::first-letter {
        font-size: 20px;
      }

      .logout button {
        font-size: 0;
      }

      .logout button::before {
        content: "↪";
        font-size: 20px;
      }

      .main {
        margin-left: 70px;
        width: calc(100% - 70px);
        padding: 18px;
      }

      .topbar h1 {
        font-size: 22px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      th, td {
        padding: 12px 14px;
      }
    }
  </style>
</head>

<body>

<div class="layout">

  <aside class="sidebar">

    <div class="logo">Shop<span>Brain</span></div>

    <div class="nav">
      <a href="admin.html">📊 Dashboard</a>
      <a href="orders.html">📋 Orders</a>
      <a href="agents.html" class="active">🤖 Agents</a>
      <a href="messages.html">💬 Messages</a>
      <a href="admins.html">👥 Admins</a>
      <a href="tools.html">🛠️ Tools</a>
    </div>

    <div class="logout">
      <button onclick="logout()">Logout</button>
    </div>

  </aside>

  <main class="main">

    <div id="errorBox" class="error"></div>

    <div class="topbar">
      <div>
        <h1>Agents</h1>
        <p style="color:#6b7280;margin-top:5px;">All store AI agents and their training status</p>
      </div>
      <div class="admin-info" style="background:white;padding:10px 15px;border-radius:10px;border:1px solid #e5e7eb;">
        <span id="adminName">Loading...</span>
      </div>
    </div>

    <section class="stats">
      <div class="stat">
        <div class="stat-title">TOTAL AGENTS</div>
        <div id="totalAgents" class="stat-number">0</div>
      </div>
      <div class="stat">
        <div class="stat-title">IN TRAINING</div>
        <div id="trainingAgents" class="stat-number">0</div>
      </div>
      <div class="stat">
        <div class="stat-title">ACTIVE</div>
        <div id="activeAgents" class="stat-number">0</div>
      </div>
    </section>

    <div class="filters" id="filterBar">
      <button class="filter-btn active" data-status="all">All</button>
      <button class="filter-btn" data-status="untrained">Untrained</button>
      <button class="filter-btn" data-status="training">Training</button>
      <button class="filter-btn" data-status="active">Active</button>
    </div>

    <section class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Agent Name</th>
              <th>Status</th>
              <th>Created</th>
              <th>Training Orders</th>
            </tr>
          </thead>
          <tbody id="agentsTable">
            <tr><td colspan="4" class="loading">Loading agents...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">

    <div class="modal-header">
      <h2 id="modalTitle">Agent</h2>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>

    <div class="modal-body" id="modalBody"></div>

  </div>
</div>

<script>

  const SUPABASE_URL = "https://aqxdmlyvmjmkdnqkwgot.supabase.co";
  const SUPABASE_KEY = "sb_publishable_3KNS1nc4-tFxz2zg_EoekQ_T7lyEARm";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let allAgents = [];
  let allOrders = [];
  let activeFilter = "all";

  function showError(message) {
    const box = document.getElementById("errorBox");
    box.textContent = message;
    box.style.display = "block";
  }

  function hideError() {
    document.getElementById("errorBox").style.display = "none";
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  async function checkAdmin() {
    hideError();

    const { data: { user }, error } = await supabaseClient.auth.getUser();

    if (error || !user) {
      window.location.href = "login.html";
      return false;
    }

    const { data: admin, error: adminError } = await supabaseClient
      .from("admin_profiles")
      .select("full_name, role, is_active")
      .eq("id", user.id)
      .single();

    if (adminError || !admin || !admin.is_active) {
      await supabaseClient.auth.signOut();
      window.location.href = "login.html";
      return false;
    }

    document.getElementById("adminName").textContent = admin.full_name || "Admin";
    return true;
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
  }

  async function loadAgents() {
    const allowed = await checkAdmin();
    if (!allowed) return;

    hideError();

    const [agentsRes, ordersRes] = await Promise.all([
      supabaseClient.from("agents").select("*").order("created_at", { ascending: false }),
      supabaseClient.from("training_orders").select("id, agent_id, tier, status, created_at")
    ]);

    if (agentsRes.error) {
      showError("Unable to load agents: " + agentsRes.error.message);
      return;
    }

    allAgents = agentsRes.data || [];
    allOrders = ordersRes.data || [];

    renderStats();
    renderTable();
  }

  function renderStats() {
    document.getElementById("totalAgents").textContent = allAgents.length;
    document.getElementById("trainingAgents").textContent =
      allAgents.filter(a => a.status === "training").length;
    document.getElementById("activeAgents").textContent =
      allAgents.filter(a => a.status === "active").length;
  }

  function ordersForAgent(agentId) {
    return allOrders.filter(o => o.agent_id === agentId);
  }

  function renderTable() {
    const table = document.getElementById("agentsTable");

    const filtered = activeFilter === "all"
      ? allAgents
      : allAgents.filter(a => a.status === activeFilter);

    if (filtered.length === 0) {
      table.innerHTML = `<tr><td colspan="4" class="empty">No agents in this category.</td></tr>`;
      return;
    }

    table.innerHTML = filtered.map(agent => {
      const date = new Date(agent.created_at).toLocaleDateString();
      const orderCount = ordersForAgent(agent.id).length;

      return `
        <tr class="row-clickable" onclick="openAgent('${agent.id}')">
          <td>${escapeHtml(agent.name || "Unnamed agent")}</td>
          <td><span class="status ${agent.status}">${escapeHtml(agent.status)}</span></td>
          <td>${date}</td>
          <td>${orderCount} order${orderCount === 1 ? "" : "s"}</td>
        </tr>
      `;
    }).join("");
  }

  document.getElementById("filterBar").addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;

    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.status;
    renderTable();
  });

  function openAgent(agentId) {
    const agent = allAgents.find(a => a.id === agentId);
    if (!agent) return;

    document.getElementById("modalTitle").textContent = agent.name || "Agent Detail";

    const orders = ordersForAgent(agentId)
      .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

    const ordersHtml = orders.length
      ? orders.map(o => {
          const date = new Date(o.created_at).toLocaleDateString();
          const tier = o.tier ? o.tier.charAt(0).toUpperCase() + o.tier.slice(1) : "-";
          return `
            <div class="order-item">
              ${escapeHtml(tier)} — ${date}
              <span class="status ${o.status}">${escapeHtml((o.status || "").replaceAll("_", " "))}</span>
            </div>
          `;
        }).join("")
      : `<div class="field-value" style="color:#9ca3af;">No training orders yet for this agent.</div>`;

    document.getElementById("modalBody").innerHTML = `

      <div class="field-row">
        <div class="field-label">Status</div>
        <div class="field-value">
          <span class="status ${agent.status}">${escapeHtml(agent.status)}</span>
        </div>
      </div>

      <div class="field-row">
        <div class="field-label">Created</div>
        <div class="field-value">${new Date(agent.created_at).toLocaleString()}</div>
      </div>

      <div class="field-row">
        <div class="field-label">Owner User ID</div>
        <div class="field-value">${escapeHtml(agent.user_id)}</div>
      </div>

      <div class="field-row">
        <div class="field-label">Training Order History</div>
        ${ordersHtml}
      </div>
    `;

    document.getElementById("modalOverlay").classList.add("open");
  }

  function closeModal() {
    document.getElementById("modalOverlay").classList.remove("open");
  }

  loadAgents();

</script>

</body>
</html>
