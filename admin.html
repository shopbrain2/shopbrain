<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ShopBrain Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: #111827;
      color: white;
      padding: 25px 15px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      padding: 0 15px 30px;
    }

    .logo span {
      color: #6366f1;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav button {
      border: none;
      background: transparent;
      color: #d1d5db;
      padding: 13px 15px;
      text-align: left;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .nav button:hover,
    .nav button.active {
      background: #1f2937;
      color: white;
    }

    .logout {
      position: absolute;
      bottom: 25px;
      left: 15px;
      right: 15px;
    }

    .logout button {
      width: 100%;
      padding: 12px;
      border: 1px solid #374151;
      background: transparent;
      color: #fca5a5;
      border-radius: 8px;
      cursor: pointer;
    }

    .main {
      margin-left: 250px;
      width: calc(100% - 250px);
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .topbar h1 {
      font-size: 28px;
    }

    .admin-info {
      background: white;
      padding: 10px 15px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    .stat-title {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
    }

    .card {
      background: white;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      overflow: hidden;
    }

    .card-header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .card-header h2 {
      font-size: 18px;
    }

    .refresh {
      border: none;
      background: #111827;
      color: white;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 15px 20px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
      white-space: nowrap;
    }

    th {
      font-size: 12px;
      color: #6b7280;
      text-transform: uppercase;
    }

    td {
      font-size: 14px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .pending_payment {
      background: #fef3c7;
      color: #92400e;
    }

    .payment_verified {
      background: #dbeafe;
      color: #1e40af;
    }

    .payment_rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .in_training {
      background: #ede9fe;
      color: #5b21b6;
    }

    .completed {
      background: #dcfce7;
      color: #166534;
    }

    .empty,
    .loading {
      padding: 40px;
      text-align: center;
      color: #6b7280;
    }

    .error {
      margin-bottom: 20px;
      padding: 15px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      display: none;
    }

    @media (max-width: 1000px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 70px;
        padding: 20px 8px;
      }

      .logo {
        font-size: 0;
        text-align: center;
        padding: 0 0 25px;
      }

      .logo span {
        font-size: 22px;
      }

      .nav button {
        text-align: center;
        font-size: 0;
      }

      .nav button::first-letter {
        font-size: 20px;
      }

      .logout button {
        font-size: 0;
      }

      .logout button::before {
        content: "↪";
        font-size: 20px;
      }

      .main {
        margin-left: 70px;
        width: calc(100% - 70px);
        padding: 18px;
      }

      .topbar {
        align-items: flex-start;
        gap: 15px;
        flex-direction: column;
      }

      .topbar h1 {
        font-size: 23px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .stat {
        padding: 15px;
      }

      .stat-number {
        font-size: 23px;
      }
    }

    @media (max-width: 450px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="layout">

  <aside class="sidebar">

    <div class="logo">
      Shop<span>Brain</span>
    </div>

    <div class="nav">

      <button class="active" onclick="showDashboard()">
        📊 Dashboard
      </button>

      <button onclick="showOrders()">
        📋 Orders
      </button>

      <button onclick="showAgents()">
        🤖 Agents
      </button>

      <button onclick="showMessages()">
        💬 Messages
      </button>

      <button onclick="showAdmins()">
        👥 Admins
      </button>

    </div>

    <div class="logout">
      <button onclick="logout()">Logout</button>
    </div>

  </aside>


  <main class="main">

    <div id="errorBox" class="error"></div>

    <div class="topbar">

      <div>
        <h1>Admin Dashboard</h1>

        <p style="color:#6b7280;margin-top:5px;">
          Manage ShopBrain training orders
        </p>
      </div>

      <div class="admin-info">
        <span id="adminName">Loading...</span>
      </div>

    </div>


    <section class="stats">

      <div class="stat">
        <div class="stat-title">TOTAL ORDERS</div>
        <div id="totalOrders" class="stat-number">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">PENDING PAYMENT</div>
        <div id="pendingOrders" class="stat-number">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">IN TRAINING</div>
        <div id="trainingOrders" class="stat-number">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">COMPLETED</div>
        <div id="completedOrders" class="stat-number">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">REVENUE</div>
        <div id="revenue" class="stat-number">$0</div>
      </div>

    </section>


    <section class="card">

      <div class="card-header">

        <h2>Recent Training Orders</h2>

        <button class="refresh" onclick="loadDashboard()">
          ↻ Refresh
        </button>

      </div>

      <div class="table-wrapper">

        <table>

          <thead>
            <tr>
              <th>Business</th>
              <th>Tier</th>
              <th>Price</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>

          <tbody id="ordersTable">

            <tr>
              <td colspan="5" class="loading">
                Loading orders...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </section>

  </main>

</div>


<script>

  // ==========================================================
  // SHOPBRAIN SUPABASE
  // ==========================================================

  const SUPABASE_URL =
    "https://aqxdmlyvmjmkdnqkwgot.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_3KNS1nc4-tFxz2zg_EoekQ_T7lyEARm";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================================
  // ERROR
  // ==========================================================

  function showError(message) {

    const box =
      document.getElementById("errorBox");

    box.textContent = message;

    box.style.display = "block";
  }


  function hideError() {

    document.getElementById("errorBox")
      .style.display = "none";
  }


  // ==========================================================
  // CHECK ADMIN
  // ==========================================================

  async function checkAdmin() {

    hideError();

    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();


    if (error || !user) {

      window.location.href = "login.html";

      return false;
    }


    const {
      data: admin,
      error: adminError
    } = await supabaseClient

      .from("admin_profiles")

      .select("full_name, role, is_active")

      .eq("id", user.id)

      .single();


    if (adminError || !admin) {

      await supabaseClient.auth.signOut();

      window.location.href = "login.html";

      return false;
    }


    if (!admin.is_active) {

      await supabaseClient.auth.signOut();

      alert("Your admin account is inactive.");

      window.location.href = "login.html";

      return false;
    }


    document.getElementById("adminName")
      .textContent =
      admin.full_name || "Admin";


    return true;
  }


  // ==========================================================
  // LOAD DASHBOARD
  // ==========================================================

  async function loadDashboard() {

    const allowed = await checkAdmin();

    if (!allowed) return;

    hideError();


    let {
      data: orders,
      error
    } = await supabaseClient

      .from("training_orders")

      .select("*")

      .order("created_at", {
        ascending: false
      });


    if (error) {

      showError(
        "Unable to load orders: " +
        error.message
      );

      return;
    }


    orders = orders || [];


    // TOTAL ORDERS

    document.getElementById("totalOrders")
      .textContent = orders.length;


    // PENDING PAYMENT

    document.getElementById("pendingOrders")
      .textContent =
      orders.filter(
        order =>
          order.status === "pending_payment"
      ).length;


    // IN TRAINING

    document.getElementById("trainingOrders")
      .textContent =
      orders.filter(
        order =>
          order.status === "in_training"
      ).length;


    // COMPLETED

    document.getElementById("completedOrders")
      .textContent =
      orders.filter(
        order =>
          order.status === "completed"
      ).length;


    // REVENUE

    const revenue =
      orders

        .filter(order =>
          order.status === "completed" ||
          order.status === "in_training" ||
          order.status === "payment_verified"
        )

        .reduce(
          (total, order) =>
            total +
            Number(order.price_usd || 0),
          0
        );


    document.getElementById("revenue")
      .textContent =
      "$" + revenue.toFixed(2);


    // RECENT ORDERS

    const table =
      document.getElementById("ordersTable");


    if (orders.length === 0) {

      table.innerHTML = `
        <tr>
          <td colspan="5" class="empty">
            No training orders yet.
          </td>
        </tr>
      `;

      return;
    }


    table.innerHTML =
      orders.slice(0, 10)
        .map(order => {

          const date =
            new Date(
              order.created_at
            ).toLocaleDateString();


          const tier =
            order.tier
              ? order.tier.charAt(0)
                  .toUpperCase() +
                order.tier.slice(1)
              : "-";


          const status =
            order.status
              ? order.status
                  .replaceAll("_", " ")
              : "-";


          return `

            <tr>

              <td>
                ${escapeHtml(
                  order.business_name ||
                  "Unnamed business"
                )}
              </td>

              <td>
                ${escapeHtml(tier)}
              </td>

              <td>
                $${Number(
                  order.price_usd || 0
                ).toFixed(2)}
              </td>

              <td>
                <span
                  class="status ${order.status}"
                >
                  ${escapeHtml(status)}
                </span>
              </td>

              <td>
                ${date}
              </td>

            </tr>

          `;

        })
        .join("");
  }


  // ==========================================================
  // SECURITY — ESCAPE HTML
  // ==========================================================

  function escapeHtml(value) {

    return String(value)

      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  // ==========================================================
  // LOGOUT
  // ==========================================================

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href = "login.html";
  }


  // ==========================================================
  // NAVIGATION
  // ==========================================================

  function showDashboard() {

    loadDashboard();
  }


  function showOrders() {

    alert(
      "Orders page will be connected next."
    );
  }


  function showAgents() {

    alert(
      "Agents page will be connected next."
    );
  }


  function showMessages() {

    alert(
      "Messages page will be connected next."
    );
  }


  function showAdmins() {

    alert(
      "Admin management will be connected next."
    );
  }


  // ==========================================================
  // START
  // ==========================================================

  loadDashboard();

</script>

</body>
</html>
